<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rice & Pasta Timer</title>
    <link rel="stylesheet" href="style.css?v=2">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0d0d12">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Roboto+Mono:wght@500&display=swap"
        rel="stylesheet">
</head>

<body>
    <div class="version-tag">v1.5</div>
    <div class="background-blobs">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
    </div>

    <main class="container">
        <header>
            <h1>Rice & Pasta Timer</h1>
            <p class="subtitle">Perfect timing for every meal</p>
        </header>

        <section class="timer-card">
            <div class="controls-row">
                <div class="input-group">
                    <label for="category-select">Type</label>
                    <select id="category-select">
                        <option value="" disabled selected>Select...</option>
                        <option value="rice">Rice</option>
                        <option value="pasta">Pasta</option>
                    </select>
                </div>
                <div class="input-group">
                    <label for="item-select">Variety</label>
                    <select id="item-select" disabled>
                        <option value="" disabled selected>Select type first</option>
                    </select>
                </div>
            </div>

            <div class="timer-display">
                <span id="timer-minutes">00</span>:<span id="timer-seconds">00</span>
            </div>

            <div class="timer-controls">
                <button id="start-btn" class="btn primary" disabled>Start</button>
                <button id="stop-btn" class="btn secondary" disabled>Stop</button>
                <button id="reset-btn" class="btn outline" disabled>Reset</button>
            </div>
        </section>
    </main>

    </section>
    </main>

    <!-- Audio is handled via Web Audio API now -->

    <script src="script.js?v=2"></script>
</body>

</html>
